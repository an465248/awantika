<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnMusic Downloader - 4K Video & HD Audio from All Platforms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --border: #2d2d44;
            --text: #e4e4e7;
            --text-muted: #71717a;
            --accent: #22d3ee;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(circle at 20% 80%, rgba(34, 211, 238, 0.08), transparent);
        }
        .navbar { background: rgba(26, 26, 46, 0.9) !important; backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .brand-text { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .hero { padding: 4rem 0; }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
        .hero .highlight { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); font-size: 1.25rem; max-width: 600px; }
        .card-custom { background: var(--card); border: 1px solid var(--border); border-radius: 16px; transition: all 0.3s ease; }
        .card-custom:hover { border-color: var(--primary); box-shadow: 0 20px 40px rgba(99, 102, 241, 0.1); transform: translateY(-2px); }
        .input-group-custom { position: relative; }
        .input-group-custom .form-control {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 1rem 1rem 1rem 3rem; border-radius: 12px; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group-custom .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); outline: none; }
        .input-group-custom .form-control::placeholder { color: var(--text-muted); }
        .input-group-custom .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.25rem; pointer-events: none; }
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; padding: 1rem 2rem; border-radius: 12px; font-weight: 600;
            font-size: 1rem; transition: all 0.3s ease;
        }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
        .btn-primary-custom:disabled { opacity: 0.6; transform: none; }
        .option-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; cursor: pointer; transition: all 0.2s ease; }
        .option-card:hover, .option-card.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .option-card input { display: none; }
        .option-card .icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem; }
        .option-card.video .icon { background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; }
        .option-card.audio .icon { background: linear-gradient(135deg, var(--accent), #06b6d4); color: var(--bg); }
        .quality-badge { display: inline-block; padding: 0.35rem 0.85rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-right: 0.5rem; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .quality-badge.video { background: rgba(99, 102, 241, 0.15); color: var(--primary); border-color: rgba(99, 102, 241, 0.3); }
        .quality-badge.audio { background: rgba(34, 211, 238, 0.15); color: var(--accent); border-color: rgba(34, 211, 238, 0.3); }
        .quality-badge:hover { transform: scale(1.05); border-color: var(--primary); }
        .quality-badge.audio:hover { border-color: var(--accent); }
        .quality-badge.selected { background: var(--primary) !important; color: white !important; border-color: var(--primary) !important; }
        .quality-badge.audio.selected { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; }
        .quality-badge.disabled { opacity: 0.4; pointer-events: none; }
        .quality-container { min-height: 80px; }
        .quality-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; display: block; }
        .video-preview { display: none; }
        .video-preview.active { display: block; animation: fadeIn 0.3s ease; }
        .video-preview img { border-radius: 12px; width: 100%; max-height: 200px; object-fit: cover; }
        .video-preview h5 { margin-top: 0.75rem; font-weight: 600; word-break: break-word; }
        .video-preview .meta { color: var(--text-muted); font-size: 0.875rem; }
        .platform-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; background: rgba(99, 102, 241, 0.2); color: var(--primary); border: 1px solid rgba(99, 102, 241, 0.3); }
        .footer { border-top: 1px solid var(--border); padding: 2rem 0; color: var(--text-muted); }
        .supported-sites { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; justify-content: center; }
        .site-badge { background: var(--bg); border: 1px solid var(--border); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; color: var(--text-muted); transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.35rem; }
        .site-badge:hover { border-color: var(--primary); color: var(--primary); }
        .toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; }
        .toast-custom { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; min-width: 280px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 576px) { .hero { padding: 2.5rem 0; } .option-card { padding: 1rem; } .quality-badge { font-size: 0.7rem; padding: 0.25rem 0.65rem; } }
        
        /* New Magic Widget Box Style */
        #magicWidgetBox { display: none; text-align: center; border: 2px dashed var(--primary); background: rgba(99, 102, 241, 0.05); }
        #magicWidgetBox.active { display: block; animation: fadeIn 0.4s ease; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 px-md-5 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-music-note-beamed" style="font-size: 1.75rem;"></i>
                <span class="brand-text fs-4">AnMusic Downloader</span>
            </a>
        </div>
    </nav>

    <main class="px-4 px-md-5 py-5">
        <div class="container">
            <section class="hero text-center mx-auto" style="max-width: 800px;">
                <h1>Download <span class="highlight">4K Videos</span> & <span class="highlight">HD Audio</span></h1>
                <p class="mx-auto">From YouTube, Instagram, TikTok, Twitter/X, Facebook, Vimeo, SoundCloud, Reddit, and 1000+ sites</p>
            </section>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-10 col-xl-8">
                    <div class="card-custom p-4 p-md-5 mb-4">
                        <div class="input-group-custom mb-4">
                            <i class="bi bi-link-45deg input-icon"></i>
                            <input type="url" class="form-control" id="urlInput" placeholder="Paste video/music URL here (YouTube, Instagram, TikTok, etc.)" autocomplete="off">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold mb-3">Download Type</label>
                            <div class="d-flex gap-3 flex-wrap">
                                <label class="option-card video selected flex-1 text-center" data-type="video" onclick="selectType('video')">
                                    <input type="radio" name="formatType" value="video" checked>
                                    <div class="icon"><i class="bi bi-play-circle-fill"></i></div>
                                    <strong>Video</strong>
                                    <div class="quality-container" id="videoQualities">
                                        <span class="quality-label">Enter URL to load video qualities</span>
                                    </div>
                                </label>
                                <label class="option-card audio flex-1 text-center" data-type="audio" onclick="selectType('audio')">
                                    <input type="radio" name="formatType" value="audio">
                                    <div class="icon"><i class="bi bi-music-note-beamed"></i></div>
                                    <strong>Audio (MP3)</strong>
                                    <div class="quality-container" id="audioQualities">
                                        <span class="quality-label">Enter URL to load audio qualities</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button class="btn btn-primary-custom w-100 btn-lg" id="downloadBtn" onclick="startDownload()" disabled>
                            <span id="btnText"><i class="bi bi-cloud-arrow-down-fill me-2"></i>Generate Download Link</span>
                        </button>
                    </div>

                    <!-- Magic Iframe Box (Replaced Backend Progress Bar) -->
                    <div id="magicWidgetBox" class="card-custom p-4 mt-3">
                        <h5 class="text-success mb-2"><i class="bi bi-check-circle-fill me-2"></i>Link Generated Successfully!</h5>
                        <p class="text-muted mb-4" style="font-size: 0.9rem;">Click the download button below to save your file directly.</p>
                        <!-- Iframe will be injected here -->
                        <div id="iframeContainer" style="min-height: 65px;"></div>
                    </div>

                    <div class="video-preview card-custom p-4 mt-3" id="videoPreview">
                        <div class="d-flex align-items-start gap-3">
                            <img id="previewThumb" src="" alt="Video thumbnail" style="width: 120px; height: 68px; border-radius: 8px; object-fit: cover; flex-shrink: 0;">
                            <div class="flex-1 min-width-0">
                                <div class="d-flex align-items-center gap-2 flex-wrap mb-1" id="previewMetaTop"></div>
                                <h5 id="previewTitle" class="mb-1"></h5>
                                <div class="meta" id="previewMeta"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="footer mt-5">
                <div class="container text-center">
                    <p class="mb-2">AnMusic Downloader • Fast, Free & Errorless!</p>
                    <div class="supported-sites" id="supportedSites"></div>
                </div>
            </footer>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedFormat = 'video';
        let selectedQuality = '720';
        let availableVideoQualities = [];
        let availableAudioQualities = [];
        let currentPlatform = null;

        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const videoPreview = document.getElementById('videoPreview');
        const previewThumb = document.getElementById('previewThumb');
        const previewTitle = document.getElementById('previewTitle');
        const previewMeta = document.getElementById('previewMeta');
        const previewMetaTop = document.getElementById('previewMetaTop');
        const videoQualitiesContainer = document.getElementById('videoQualities');
        const audioQualitiesContainer = document.getElementById('audioQualities');
        const supportedSitesContainer = document.getElementById('supportedSites');
        const magicWidgetBox = document.getElementById('magicWidgetBox');
        const iframeContainer = document.getElementById('iframeContainer');

        urlInput.addEventListener('input', debounce(async () => {
            const url = urlInput.value.trim();
            downloadBtn.disabled = !isValidUrl(url);
            magicWidgetBox.classList.remove('active');
            
            if (isValidUrl(url)) {
                await fetchVideoInfo(url);
            } else {
                hidePreview();
                resetQualities();
            }
        }, 500));

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        async function fetchVideoInfo(url) {
            try {
                // Info preview feature will still use your backend, but if it fails, the user can still download!
                const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
                if (!res.ok) return;
                const data = await res.json();
                showPreview(data);
                renderQualities(data);
            } catch (e) {
                console.log('Info fetch failed, but download will still work:', e);
            }
        }

        async function loadSupportedSites() {
            try {
                const res = await fetch('/api/platforms');
                const data = await res.json();
                renderSupportedSites(data.platforms);
            } catch (e) {}
        }

        function renderSupportedSites(platforms) {
            if(!platforms) return;
            supportedSitesContainer.innerHTML = platforms.map(p => 
                `<span class="site-badge"><i class="bi ${p.icon}"></i>${p.name}</span>`
            ).join('');
        }

        function renderQualities(data) {
            availableVideoQualities = data.video_qualities || [];
            availableAudioQualities = data.audio_qualities || [];
            currentPlatform = data.platform;
            renderVideoQualities();
            renderAudioQualities();
        }

        function renderVideoQualities() {
            if (availableVideoQualities.length === 0) {
                videoQualitiesContainer.innerHTML = '<span class="quality-label">Standard Qualities Available</span>';
                return;
            }
            const badges = availableVideoQualities.map(q => 
                `<span class="quality-badge video" data-quality="${q.height}" onclick="event.stopPropagation(); selectQuality('${q.height}')">${q.label}</span>`
            ).join('');
            videoQualitiesContainer.innerHTML = `<span class="quality-label">${availableVideoQualities.length} video qualities available</span>${badges}`;
            
            if (selectedFormat === 'video' && availableVideoQualities.length > 0) {
                selectQuality(availableVideoQualities[0].height.toString());
            }
        }

        function renderAudioQualities() {
            if (availableAudioQualities.length === 0) {
                audioQualitiesContainer.innerHTML = '<span class="quality-label">Standard Audio Available</span>';
                return;
            }
            const badges = availableAudioQualities.map(q => 
                `<span class="quality-badge audio" data-quality="${q.abr}" onclick="event.stopPropagation(); selectQuality('${q.abr}')">${q.label}</span>`
            ).join('');
            audioQualitiesContainer.innerHTML = `<span class="quality-label">${availableAudioQualities.length} audio qualities available</span>${badges}`;
            
            if (selectedFormat === 'audio' && availableAudioQualities.length > 0) {
                selectQuality(availableAudioQualities[0].abr.toString());
            }
        }

        function resetQualities() {
            videoQualitiesContainer.innerHTML = '<span class="quality-label">Enter URL to load qualities</span>';
            audioQualitiesContainer.innerHTML = '<span class="quality-label">Enter URL to load qualities</span>';
            availableVideoQualities = [];
            availableAudioQualities = [];
        }

        function showPreview(data) {
            if (data.thumbnail) previewThumb.src = data.thumbnail;
            previewTitle.textContent = data.title || 'Unknown Title';
            const duration = data.duration ? formatDuration(data.duration) : 'Unknown duration';
            const uploader = data.uploader || 'Unknown uploader';
            
            previewMetaTop.innerHTML = '';
            if (currentPlatform && currentPlatform !== 'unknown') {
                previewMetaTop.innerHTML = `<span class="platform-badge"><i class="bi bi-${getPlatformIcon(currentPlatform)} me-1"></i>${capitalize(currentPlatform)}</span>`;
            }
            previewMeta.innerHTML = `<i class="bi bi-clock me-1"></i>${duration} • <i class="bi bi-person me-1"></i>${uploader}`;
            videoPreview.classList.add('active');
        }

        function getPlatformIcon(platform) {
            const icons = {'youtube': 'youtube', 'instagram': 'instagram', 'tiktok': 'tiktok', 'twitter': 'twitter-x', 'facebook': 'facebook'};
            return icons[platform] || 'globe';
        }

        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
        function hidePreview() { videoPreview.classList.remove('active'); }
        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
            return h > 0 ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : `${m}:${s.toString().padStart(2,'0')}`;
        }

        function selectType(type) {
            selectedFormat = type;
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.type === type);
                card.querySelector('input').checked = card.dataset.type === type;
            });
            updateQualityBadges(type);
        }

        function updateQualityBadges(type) {
            document.querySelectorAll('.quality-badge').forEach(badge => {
                if ((type === 'video' && badge.classList.contains('video')) || (type === 'audio' && badge.classList.contains('audio'))) {
                    badge.style.opacity = '1'; badge.style.pointerEvents = 'auto'; badge.classList.remove('disabled');
                } else {
                    badge.style.opacity = '0.4'; badge.style.pointerEvents = 'none'; badge.classList.add('disabled');
                }
            });
        }

        function selectQuality(quality) {
            selectedQuality = quality;
            document.querySelectorAll('.quality-badge').forEach(badge => {
                badge.classList.toggle('selected', badge.dataset.quality === quality);
            });
        }

        // --- NEW MAGIC DOWNLOAD FUNCTION ---
        function startDownload() {
            const url = urlInput.value.trim();
            if (!isValidUrl(url)) return showToast('Please enter a valid URL', 'error');

            let formatId = '720'; // Default video quality
            
            if (selectedFormat === 'audio') {
                formatId = 'mp3';
            } else {
                // Map the quality selected by user
                let q = selectedQuality.toString();
                if(q.includes('2160') || q.includes('4k')) formatId = '4k';
                else if(q.includes('1440')) formatId = '1440';
                else if(q.includes('1080')) formatId = '1080';
                else if(q.includes('720')) formatId = '720';
                else if(q.includes('480')) formatId = '480';
                else if(q.includes('360')) formatId = '360';
                else formatId = '720';
            }

            // Hide old stuff, show magic box
            hidePreview();
            magicWidgetBox.classList.add('active');
            
            // Inject the loader.to iframe
            iframeContainer.innerHTML = `<iframe style="width:100%; max-width:350px; height:60px; border:0; overflow:hidden;" scrolling="no" src="https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=${formatId}"></iframe>`;
            
            showToast('Download link generated!', 'success');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.innerHTML = `<div class="d-flex align-items-center gap-2"><i class="bi ${type === 'success' ? 'bi-check-circle-fill text-success' : type === 'error' ? 'bi-x-circle-fill text-danger' : 'bi-info-circle-fill text-primary'}"></i><span>${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function debounce(fn, delay) {
            let timeoutId;
            return (...args) => {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        loadSupportedSites();
    </script>
</body>
</html>
